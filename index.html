<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101014"><title>NOCTA — Music for your mood</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#f5f5f7;font:15px Arial,sans-serif}
header{padding:22px 18px;border-bottom:1px solid #292932;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:800;letter-spacing:4px;color:#b69cff}header small{color:#999}
main{max-width:900px;margin:auto;padding:22px 16px 120px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
button{border:0;border-radius:22px;padding:10px 15px;background:#292932;color:#eee;cursor:pointer}
button.active,.primary{background:#9b7bff;color:#100d18;font-weight:bold}
input{width:100%;padding:15px;border-radius:14px;border:1px solid #383844;background:#1b1b23;color:white;font-size:16px}
h2{font-size:22px}.muted{color:#999}.tracks{display:grid;gap:10px;margin-top:16px}
.track{display:flex;gap:12px;align-items:center;background:#1b1b23;padding:10px;border-radius:14px}
.track img{width:58px;height:58px;border-radius:9px;object-fit:cover}.info{min-width:0;flex:1}.info b,.info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.info small{color:#aaa;margin-top:6px}
.track button{padding:9px 11px}.empty{color:#999;padding:25px 5px;text-align:center}
.player{position:fixed;bottom:0;left:0;right:0;background:#191920;border-top:1px solid #353541;padding:12px 16px;display:flex;gap:12px;align-items:center}
.player img{width:48px;height:48px;border-radius:8px}.player .info{flex:1;min-width:0}.player button{background:#9b7bff;color:#100d18;font-weight:bold}
audio{display:none}footer{text-align:center;color:#777;font-size:12px;margin-top:35px}a{color:#b69cff}
</style></head>
<body>
<header><div class="logo">NOCTA</div><small>Music for your mood</small></header>
<main>
<nav>
<button class="active" data-page="search">Cari Musik</button>
<button data-page="favorites">Favorit ♡</button>
<button data-page="playlist">Playlist</button>
</nav>
<section id="search">
<h2>Temukan musikmu</h2>
<form id="searchForm"><input id="query" placeholder="Cari judul lagu atau penyanyi..." autocomplete="off"></form>
<p class="muted" id="status">Ketik nama lagu lalu tekan Enter.</p>
<div class="tracks" id="results"></div>
</section>
<section id="favorites" hidden><h2>Lagu Favorit</h2><div class="tracks" id="favoriteList"></div></section>
<section id="playlist" hidden><h2>Playlist Saya</h2><button class="primary" id="newPlaylist">＋ Buat playlist</button><div id="playlists"></div></section>
<footer>© 2026 NOCTA · Owner: bil gtg ky jfri<br>Admin TikTok: <a href="https://www.tiktok.com/@eldigidw?_r=1&_t=ZS-9Au8ckVUVmi" target="_blank" rel="noopener"> @eldigidw </a><br><small>Preview musik disediakan oleh iTunes.</small></footer>
</main>
<div class="player">
<img id="cover" src="" alt="" style="display:none">
<div class="info"><b id="songTitle">Belum ada lagu diputar</b><small id="songArtist">Pilih lagu untuk mulai mendengarkan</small></div>
<button id="playPause">▶</button>
</div>
<audio id="audio" controls></audio>
<script>
const $=id=>document.getElementById(id);
let tracks=[], favorites=JSON.parse(localStorage.getItem('nocta-favs')||'[]'),
playlists=JSON.parse(localStorage.getItem('nocta-playlists')||'[]'), current=null;
function save(){localStorage.setItem('nocta-favs',JSON.stringify(favorites));localStorage.setItem('nocta-playlists',JSON.stringify(playlists))}
function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(t){let fav=favorites.some(x=>x.trackId===t.trackId);return `<div class="track"><img src="${safe(t.artworkUrl100)}"><div class="info"><b>${safe(t.trackName)}</b><small>${safe(t.artistName)}</small></div><button onclick="play(${t.trackId})">▶</button><button onclick="toggleFav(${t.trackId})">${fav?'♥':'♡'}</button></div>`}
function render(list,target){$(target).innerHTML=list.length?list.map(card).join(''):'<div class="empty">Belum ada lagu di sini.</div>'}
async function search(q){if(!q.trim())return;$('status').textContent='Sedang mencari...';$('results').innerHTML='';try{let r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(q)+'&entity=song&limit=30');let d=await r.json();tracks=d.results.filter(x=>x.previewUrl);$('status').textContent=tracks.length?'Hasil pencarian (preview singkat):':'Lagu tidak ditemukan. Coba kata kunci lain.';render(tracks,'results')}catch(e){$('status').textContent='Pencarian gagal. Periksa koneksi internet lalu coba lagi.'}}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();search($('query').value)});
function play(id){let t=[...tracks,...favorites,...playlists.flatMap(p=>p.tracks)].find(x=>x.trackId===id);if(!t)return;current=t;$('audio').src=t.previewUrl;$('audio').play();$('cover').src=t.artworkUrl100;$('cover').style.display='block';$('songTitle').textContent=t.trackName;$('songArtist').textContent=t.artistName;$('playPause').textContent='Ⅱ'}
$('playPause').onclick=()=>{if(!$('audio').src)return;if($('audio').paused){$('audio').play();$('playPause').textContent='Ⅱ'}else{$('audio').pause();$('playPause').textContent='▶'}};
$('audio').onended=()=> $('playPause').textContent='▶';
function toggleFav(id){let t=[...tracks,...favorites].find(x=>x.trackId===id);if(!t)return;favorites=favorites.some(x=>x.trackId===id)?favorites.filter(x=>x.trackId!==id):[...favorites,t];save();render(tracks,'results');render(favorites,'favoriteList')}
window.play=play;window.toggleFav=toggleFav;
function show(page){document.querySelectorAll('main section').forEach(s=>s.hidden=s.id!==page);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='favorites')render(favorites,'favoriteList');if(page==='playlist')renderPlaylists()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));
function renderPlaylists(){$('playlists').innerHTML=playlists.length?playlists.map((p,i)=>`<div class="track" style="margin-top:12px"><div class="info"><b>${safe(p.name)}</b><small>${p.tracks.length} lagu</small></div><button onclick="addSong(${i})">＋ Lagu</button><button onclick="openList(${i})">Lihat</button></div><div id="pl${i}"></div>`).join(''):'<p class="empty">Belum ada playlist.</p>'}
function addSong(i){if(!tracks.length){alert('Cari lagu terlebih dahulu di menu Cari Musik.');return}let t=tracks[0];if(!playlists[i].tracks.some(x=>x.trackId===t.trackId))playlists[i].tracks.push(t);save();renderPlaylists();alert('Lagu pertama dari hasil pencarian ditambahkan.')}
function openList(i){render(playlists[i].tracks,'pl'+i)}
$('newPlaylist').onclick=()=>{let name=prompt('Nama playlist:');if(name&&name.trim()){playlists.push({name:name.trim(),tracks:[]});save();renderPlaylists()}}
</script></body></html>
